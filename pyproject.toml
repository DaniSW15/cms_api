[project]
name = "cms-api"
version = "0.1.0"
description = "CMS API con FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",      # Driver para PostgreSQL
    "alembic>=1.13.0",              # Migraciones
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",     # Para leer .env
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",       # Hash de contraseñas
    "python-multipart>=0.0.9",      # Para formularios (login con OAuth2)
    "email-validator>=2.0.0",       # Validar emails en Pydantic
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",                # Para testear endpoints async
    "factory-boy>=3.3.0",           # Generar datos de prueba
]